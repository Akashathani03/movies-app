<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="500" viewBox="0 0 1600 500">
  <title>Cinema banner: film reel, clapperboard, popcorn, tickets and movie genre icons</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1230"/>
      <stop offset="0.55" stop-color="#2b1050"/>
      <stop offset="1" stop-color="#4a0d24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="frames" width="800" height="56" patternUnits="userSpaceOnUse">
      <rect x="8" y="17" width="84" height="22" rx="3" fill="#e63946"/>
      <rect x="108" y="17" width="84" height="22" rx="3" fill="#f4a261"/>
      <rect x="208" y="17" width="84" height="22" rx="3" fill="#2a9d8f"/>
      <rect x="308" y="17" width="84" height="22" rx="3" fill="#457b9d"/>
      <rect x="408" y="17" width="84" height="22" rx="3" fill="#9b5de5"/>
      <rect x="508" y="17" width="84" height="22" rx="3" fill="#f15bb5"/>
      <rect x="608" y="17" width="84" height="22" rx="3" fill="#00bbf9"/>
      <rect x="708" y="17" width="84" height="22" rx="3" fill="#fee440"/>
    </pattern>
    <g id="strip">
      <rect width="1600" height="56" fill="#0d0d14"/>
      <line x1="0" y1="8" x2="1600" y2="8" stroke="#cfd3dc" stroke-width="7" stroke-dasharray="12 28" opacity="0.8"/>
      <line x1="0" y1="48" x2="1600" y2="48" stroke="#cfd3dc" stroke-width="7" stroke-dasharray="12 28" opacity="0.8"/>
      <rect width="1600" height="56" fill="url(#frames)" opacity="0.85"/>
    </g>
    <g id="bar">
      <rect width="160" height="30" rx="4" fill="#f5f5f5"/>
      <path d="M18 0h20l-14 30h-20zM58 0h20l-14 30h-20zM98 0h20l-14 30h-20zM138 0h20l-14 30h-20z" fill="#1f2230"/>
    </g>
    <path id="star" d="M0-10L2.9-4 9.5-3.1 4.7 1.5 5.9 8.1 0 5-5.9 8.1-4.7 1.5-9.5-3.1-2.9-4Z"/>
    <path id="ticket" d="M0 0H130V18A12 12 0 0 0 130 42V60H0V42A12 12 0 0 0 0 18Z"/>
    <clipPath id="bucket"><path d="M0 50H128L112 170H16Z"/></clipPath>
  </defs>

  <!-- Backdrop, glow and projector beams -->
  <rect width="1600" height="500" fill="url(#bg)"/>
  <ellipse cx="800" cy="250" rx="560" ry="250" fill="url(#glow)"/>
  <polygon points="0,56 170,56 900,444 600,444" fill="#ffffff" opacity="0.05"/>
  <polygon points="1600,56 1430,56 700,444 1000,444" fill="#ffffff" opacity="0.05"/>
  <g fill="#ffffff" opacity="0.6">
    <circle cx="380" cy="90" r="2"/><circle cx="560" cy="150" r="1.5"/><circle cx="640" cy="80" r="2.5"/>
    <circle cx="980" cy="90" r="2"/><circle cx="1060" cy="160" r="1.5"/><circle cx="1200" cy="80" r="2"/>
    <circle cx="820" cy="110" r="1.5"/><circle cx="300" cy="400" r="1.5"/><circle cx="1280" cy="410" r="2"/>
    <circle cx="700" cy="420" r="1.5"/><circle cx="1500" cy="260" r="2"/><circle cx="60" cy="300" r="2"/>
  </g>

  <!-- Film strips (multicoloured frames = many different movies) -->
  <use xlink:href="#strip"/>
  <use xlink:href="#strip" y="444"/>

  <!-- Drama / comedy masks -->
  <g transform="translate(110 170) rotate(-12)">
    <path d="M-28-30Q0-40 28-30Q30 8 0 36Q-30 8-28-30Z" fill="#fee440"/>
    <path d="M-16-12q6-6 12 0M4-12q6-6 12 0M-14 8q14 14 28 0" fill="none" stroke="#2b1050" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g transform="translate(165 205) rotate(14)">
    <path d="M-28-30Q0-40 28-30Q30 8 0 36Q-30 8-28-30Z" fill="#7aa7ff"/>
    <path d="M-16-8q6 6 12 0M4-8q6 6 12 0M-14 20q14-14 28 0" fill="none" stroke="#0b1230" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Film reel with trailing film -->
  <path d="M300 330C360 400 430 420 520 410" fill="none" stroke="#111118" stroke-width="34"/>
  <path d="M300 330C360 400 430 420 520 410" fill="none" stroke="#cfd3dc" stroke-width="5" stroke-dasharray="6 10"/>
  <g transform="translate(300 260)">
    <circle r="96" fill="#cfd3dc"/>
    <circle r="96" fill="none" stroke="#9aa0ad" stroke-width="6"/>
    <g fill="#2b1050">
      <circle r="15"/><circle cy="-54" r="25"/><circle cx="51" cy="-17" r="25"/>
      <circle cx="32" cy="44" r="25"/><circle cx="-32" cy="44" r="25"/><circle cx="-51" cy="-17" r="25"/>
    </g>
  </g>

  <!-- Clapperboard -->
  <g transform="translate(455 205)">
    <rect y="40" width="160" height="112" rx="8" fill="#1f2230" stroke="#e5e7eb" stroke-width="4"/>
    <use xlink:href="#bar" y="40"/>
    <g transform="rotate(-16 0 40)"><use xlink:href="#bar" y="6"/></g>
    <g stroke="#e5e7eb" stroke-width="4" opacity="0.6">
      <line x1="20" y1="98" x2="140" y2="98"/><line x1="20" y1="120" x2="140" y2="120"/><line x1="20" y1="140" x2="100" y2="140"/>
    </g>
  </g>

  <!-- Genre icons: romance, action, sci-fi, horror -->
  <path transform="translate(690 125) scale(2.4)" d="M0 12C-18 0-14-14 0-6C14-14 18 0 0 12Z" fill="#f15bb5"/>
  <polygon transform="translate(925 120) scale(2.2)" points="6,-18 -8,2 0,2 -6,18 10,-4 2,-4" fill="#f4a261"/>
  <g transform="translate(1385 150) rotate(35)">
    <path d="M0-34C12-22 12 10 8 20H-8C-12 10-12-22 0-34Z" fill="#00bbf9"/>
    <circle cy="-10" r="5" fill="#0b1230"/>
    <path d="M-8 8L-18 24-8 20ZM8 8L18 24 8 20Z" fill="#9b5de5"/>
    <path d="M-5 20L0 34 5 20Z" fill="#f4a261"/>
  </g>
  <g transform="translate(1520 330)">
    <path d="M-22 22V-4A22 22 0 0 1 22-4V22L15 15 8 22 0 15-8 22-15 15Z" fill="#e9e3ff" opacity="0.9"/>
    <circle cx="-8" cy="-4" r="4" fill="#2b1050"/><circle cx="8" cy="-4" r="4" fill="#2b1050"/>
  </g>

  <!-- Popcorn -->
  <g transform="translate(1040 215)">
    <g fill="#fff3c4">
      <circle cx="20" cy="42" r="22"/><circle cx="50" cy="27" r="24"/><circle cx="82" cy="32" r="23"/>
      <circle cx="108" cy="44" r="20"/><circle cx="36" cy="20" r="16"/><circle cx="68" cy="10" r="18"/><circle cx="96" cy="18" r="15"/>
    </g>
    <g fill="#f7c948" opacity="0.7"><circle cx="44" cy="36" r="8"/><circle cx="76" cy="24" r="7"/><circle cx="100" cy="38" r="6"/></g>
    <g clip-path="url(#bucket)">
      <rect y="50" width="128" height="120" fill="#f5f5f5"/>
      <g fill="#e63946"><rect y="50" width="16" height="120"/><rect x="32" y="50" width="16" height="120"/><rect x="64" y="50" width="16" height="120"/><rect x="96" y="50" width="16" height="120"/></g>
    </g>
    <rect x="-4" y="46" width="136" height="10" rx="3" fill="#e63946"/>
  </g>

  <!-- Tickets -->
  <g transform="translate(1250 300) rotate(-10)">
    <use xlink:href="#ticket" fill="#f4c542"/>
    <line x1="96" y1="6" x2="96" y2="54" stroke="#8a5a00" stroke-width="3" stroke-dasharray="5 5"/>
    <use xlink:href="#star" transform="translate(48 30) scale(1.6)" fill="#8a5a00"/>
  </g>
  <g transform="translate(1290 330) rotate(9)">
    <use xlink:href="#ticket" fill="#f4a261"/>
    <line x1="96" y1="6" x2="96" y2="54" stroke="#7a3b10" stroke-width="3" stroke-dasharray="5 5"/>
    <use xlink:href="#star" transform="translate(48 30) scale(1.6)" fill="#7a3b10"/>
  </g>

  <!-- Sparkle stars -->
  <g fill="#fee440">
    <use xlink:href="#star" transform="translate(760 395) scale(1.4)"/>
    <use xlink:href="#star" transform="translate(860 370) scale(1)"/>
    <use xlink:href="#star" transform="translate(560 120) scale(1.1)"/>
    <use xlink:href="#star" transform="translate(1180 120) scale(1.2)"/>
  </g>
</svg>
